[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catholic-companion-api"
version = "0.1.0"
description = "Content and calendar API for Catholic Companion"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["data*", "tests*", "node_modules*"]
namespaces = false

[tool.setuptools.package-data]
app = ["prompts.yaml"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
